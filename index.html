<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div id="top-bar">
            <h1 class="js-go-home">trio</h1>
            <button id="menu-toggle"><span class="material-symbols-outlined">menu</span></button>
        </div>

        <nav class="is-hidden">
            <ul>
                <li>
                    <a href="#" class="js-go-home">Home</a>
                </li>
                <li>
                    <a href="#" class="js-go-explore">Explore</a>
                </li>
                <li>
                    <a href="#" class="js-go-collection">Collections</a>
                </li>
            </ul>
        </nav>
    </header>
    
    <main>

        <section id="home">
            <h2 id="hero-heading">Ideas in motion.</h2>
                <p id="hero-text">Movies, podcasts, and books, tailored to what you like.</p>
            <div id="hero-actions">
                <button id="hero-button-explore" class="js-go-explore hero-button" >
                    Explore
            </button>
                <button id="hero-button-collection" class="js-go-collection hero-button">
                    Collection
                </button>
            </div>
        </section>
        
        <section id="explore">
           <h2>Explore</h2>
            <div id="search-bar">
                <input type="text" id="search-input" placeholder="Search movies, podcasts, and books.">
                <button id="search-submit">
                    <span class="material-symbols-outlined">search</span>
                    Search
                </button>
                <button id="search-random"> 
                    <span class="material-symbols-outlined">lightbulb_2</span>
                    Surprise Me
                </button>
            </div>
            
            <div id="media-area">
            </div>
        </section>

        <section id="collection">
            <h2>Your Collections</h2>
            <div id= "collection-empty-state">
                <span class="material-symbols-outlined">folder_off</span>
                <p>No items yet.</p>
            </div>
        </section>
        
    </main>
    <script type="module" src="scripts/explore-ui.js"></script>
    <script type="module" src="scripts/bookmark-ui.js"></script>
    <script type="module" src="scripts/directory.js"></script>
    <script type="module" src="scripts/api.js"></script>
    <script type="module" src="scripts/media-controller.js"></script>
    <script type="module" src="scripts/spotify-authorization.js"></script>
    <script type="module" src="scripts/utilities.js"></script>
    <script type="module" src="scripts/entry-ui.js"></script>

</body>
</html>
